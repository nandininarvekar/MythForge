<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MythForge</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #14110f; --panel: #1e1a17; --ink: #eadfcf; --muted: #a8977f;
    --accent: #e0a14a; --line: #3a322b; --dm: #241f1b; --you: #2c2418;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.55 "Crimson Pro", Georgia, serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { font: 600 22px "Cinzel", serif; margin: 0; color: var(--accent); letter-spacing: 1px; }
  .wrap { display: grid; grid-template-columns: 1fr 300px; height: calc(100vh - 58px); }
  main { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; }
  .dm { background: var(--dm); border-left: 3px solid var(--accent); }
  .you { background: var(--you); align-self: flex-end; color: #f3e6d0; }
  .changes { font-size: 14px; color: var(--muted); margin-top: 6px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input { flex: 1; min-width: 0; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font: inherit; }
  button { background: var(--accent); color: #1a1208; border: 0; border-radius: 6px; padding: 10px 16px; font: 600 16px "Crimson Pro", serif; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  aside { border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; background: var(--panel); }
  aside h2 { font: 600 14px "Cinzel", serif; color: var(--accent); margin: 18px 0 6px; letter-spacing: 1px; }
  aside h2:first-child { margin-top: 0; }
  aside ul { list-style: none; padding: 0; margin: 0; font-size: 16px; }
  aside li { padding: 3px 0; }
  .att { font-size: 13px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
  .hostile { background: #6b1f1f; } .wary { background: #6b4b1f; } .neutral { background: #3d3a35; }
  .friendly { background: #275a2e; } .loyal { background: #1f4f6b; }
  .mem { color: var(--muted); font-size: 14px; }
  .chapter { margin-bottom: 10px; } .chapter b { color: var(--accent); font-size: 15px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 6px 0; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .note { align-self: center; color: var(--muted); font-style: italic; font-size: 15px; }
  #intro { max-width: 460px; margin: 12vh auto; text-align: center; padding: 0 16px; }
  #intro p { color: var(--muted); }
  @media (max-width: 760px) {
    .wrap { grid-template-columns: 1fr; height: auto; }
    main { height: 70vh; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>⚒ MythForge</h1>
  <button class="ghost" id="reset" hidden>New world</button>
</header>

<section id="intro">
  <p>Emberfall's bell has fallen silent, and every night someone vanishes into the woods.</p>
  <p>A village that never forgets — every promise, insult and debt is remembered, forever.</p>
  <form id="startForm" style="border:0;padding:0">
    <input id="name" placeholder="Your hero's name" maxlength="30" autocomplete="off" />
    <button>Begin</button>
  </form>
</section>

<div class="wrap" id="game" hidden>
  <main>
    <div id="log"></div>
    <form id="turnForm">
      <input id="msg" placeholder="What do you do?" maxlength="500" autocomplete="off" />
      <button id="send">Act</button>
      <button type="button" class="ghost" id="rest" title="Rest, and let the chronicler write down your legend">Rest</button>
    </form>
  </main>
  <aside>
    <h2>Quest</h2><div id="quest"></div>
    <h2>Hero</h2><ul id="hero"></ul>
    <h2>Inventory</h2><ul id="inv"></ul>
    <h2>People of Emberfall</h2><ul id="npcs"></ul>
    <h2>Legend</h2><ul id="chapters"></ul>
    <h2>Recent deeds</h2><ul id="events"></ul>
  </aside>
</div>

<script>
  // One world per browser (single player). Multiplayer later = share this id.
  let worldId;
  try { worldId = localStorage.getItem("mythforge-world"); } catch {}
  if (!worldId) {
    worldId = crypto.randomUUID();
    try { localStorage.setItem("mythforge-world", worldId); } catch {}
  }
  const API = `/agents/myth-agent/${worldId}`;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function call(body) {
    const res = await fetch(API, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  function addMsg(role, text, changes = [], roll) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "you" : "dm");
    div.textContent = text;
    if (changes.length || roll) {
      const c = document.createElement("div");
      c.className = "changes";
      c.textContent = [roll ? `🎲 d20: ${roll}` : null, ...changes].filter(Boolean).join("  ·  ");
      div.appendChild(c);
    }
    $("log").appendChild(div);
    $("log").scrollTop = $("log").scrollHeight;
  }

  function render(state) {
    $("intro").hidden = state.started;
    $("game").hidden = !state.started;
    $("reset").hidden = !state.started;
    if (!state.started) return;
    const q = state.quest;
    if (q) {
      const pct = Math.round((q.stage / q.total) * 100);
      $("quest").innerHTML = `<b>${esc(q.title)}</b>
        <div class="bar"><span style="width:${pct}%"></span></div>
        <div class="mem">${q.complete ? "" : `Step ${q.stage + 1} of ${q.total}: `}${esc(q.objective)}</div>`;
    }
    const p = state.player;
    $("hero").innerHTML = `<li><b>${esc(p.name)}</b></li><li>❤️ ${p.hp}/${p.maxHp} HP</li><li>🪙 ${p.gold} gold</li><li>📍 ${esc(p.location)}</li>`;
    $("inv").innerHTML = state.inventory.map((i) => `<li>${esc(i.item)} ×${i.qty}</li>`).join("") || "<li class=mem>empty</li>";
    $("npcs").innerHTML = state.npcs.map((n) =>
      `<li><b>${esc(n.name)}</b><span class="att ${esc(n.attitude)}">${esc(n.attitude)}</span><div class="mem">${esc(n.location)} — ${esc(n.memory)}</div></li>`).join("");
    $("chapters").innerHTML = (state.chapters || []).map((c) =>
      `<li class="chapter"><b>${esc(c.title)}</b><div class="mem">${esc(c.summary)}</div></li>`).join("")
      || "<li class=mem>No chapters yet. Rest to have the chronicler write one.</li>";
    $("events").innerHTML = state.recentEvents.map((e) => `<li class=mem>• ${esc(e)}</li>`).join("");
  }

  function note(text) {
    const div = document.createElement("div");
    div.className = "note";
    div.textContent = text;
    $("log").appendChild(div);
    $("log").scrollTop = $("log").scrollHeight;
  }

  // The Chronicle Workflow runs in the background; poll until the new chapter lands.
  function awaitChapter(prevCount) {
    note("📜 The chronicler dips a quill in ink…");
    let tries = 0;
    const timer = setInterval(async () => {
      try {
        const { state } = await call();
        if ((state.chapters || []).length > prevCount) {
          clearInterval(timer);
          render(state);
          const c = state.chapters[state.chapters.length - 1];
          note(`📖 ${c.title} — ${c.summary}`);
        } else if (++tries > 20) clearInterval(timer);
      } catch { clearInterval(timer); }
    }, 3000);
  }

  function busy(on) {
    document.querySelectorAll("button, input").forEach((el) => (el.disabled = on));
  }

  async function load() {
    const { state, log } = await call();
    $("log").innerHTML = "";
    log.forEach((m) => addMsg(m.role, m.content));
    render(state);
    if (state.awayNews) note(`🌙 While you were away… ${state.awayNews}`);
  }

  $("startForm").onsubmit = async (e) => {
    e.preventDefault();
    busy(true);
    try {
      const r = await call({ action: "start", name: $("name").value });
      render(r.state);
      addMsg("assistant", r.narration, r.changes);
    } catch (err) { alert(err.message); }
    busy(false);
    $("msg").focus();
  };

  $("turnForm").onsubmit = async (e) => {
    e.preventDefault();
    const text = $("msg").value.trim();
    if (!text) return;
    addMsg("user", text);
    $("msg").value = "";
    busy(true);
    try {
      const r = await call({ action: "turn", message: text });
      addMsg("assistant", r.narration, r.changes, r.roll);
      render(r.state);
      if (r.chronicling) awaitChapter(r.state.chapters.length);
    } catch (err) { addMsg("assistant", "⚠️ " + err.message); }
    busy(false);
    $("msg").focus();
  };

  $("rest").onclick = async () => {
    busy(true);
    try {
      const r = await call({ action: "rest" });
      if (r.chronicling) awaitChapter(r.state.chapters.length);
      else note("Nothing worth chronicling yet — go make some trouble.");
    } catch (err) { note("⚠️ " + err.message); }
    busy(false);
  };

  $("reset").onclick = async () => {
    if (!confirm("Destroy this world and start over?")) return;
    const r = await call({ action: "reset" });
    $("log").innerHTML = "";
    render(r.state);
  };

  load().catch((err) => console.error(err));
</script>
</body>
</html>
